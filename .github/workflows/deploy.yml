# Build and publish to GitHub Pages on every push to main.
#
# ONE-TIME SETUP after you create the repo and push:
#   GitHub → repo → Settings → Pages → "Build and deployment" → Source:
#   GitHub Actions.  (Not "Deploy from a branch".)
#
# The site then lives at:
#   https://<your-username>.github.io/<repo-name>/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a new push cancel an in-flight deploy, but never interrupt one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # BASE_PATH makes Vite emit asset URLs under the project path that Pages
      # serves the site from. Locally and on a root domain it stays "/".
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # SPA fallback. Pages serves 404.html for any unknown path, so copying
      # index.html over it makes /sok, /produsenter etc. work on a hard refresh
      # and on a shared link.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
